<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadyOnline – Neon Interactive Homepage</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at center, #0b1020 0%, #050816 60%, #000000 100%);
      color: #e3f2fd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 70px;
    }

    .top-nav {
      width: 100%;
      padding: 12px 24px;
      background: rgba(11, 17, 32, 0.85);
      border-bottom: 1px solid #1c2540;
      display: flex;
      gap: 24px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
      backdrop-filter: blur(10px);
    }

    .top-nav a {
      color: #4fc3f7;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    main {
      text-align: center;
      max-width: 800px;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #e3f2fd;
    }

    h1 span {
      color: #4fc3f7;
      text-shadow: 0 0 10px #4fc3f7;
    }

    p {
      font-size: 16px;
      color: #90a4ae;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      border: 2px solid;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      border-color: #ff80ab;
      color: #ff80ab;
    }

    .btn-primary:hover {
      background: #ff80ab;
      color: #050816;
      box-shadow: 0 0 20px #ff80ab;
    }

    .btn-secondary {
      border-color: #4fc3f7;
      color: #4fc3f7;
    }

    .btn-secondary:hover {
      background: #4fc3f7;
      color: #050816;
      box-shadow: 0 0 20px #4fc3f7;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #90a4ae;
    }
  </style>
</head>

<body>
  <header class="top-nav">
    <a href="index.html">Home</a>
    <a href="digital-street-sense.html">Street Sense</a>
    <a href="parent-guide.html">Parents</a>
  </header>

  <main>
    <h1>Navigate the Digital World.<br /><span>Fearless!</span></h1>
    <p>
      ReadyOnline equips teens and families with real skills for the digital age.
      Learn to spot red flags, decode manipulation patterns, and build confidence online.
    </p>

    <div class="buttons">
      <button class="btn btn-primary" onclick="window.location.href='digital-street-sense.html'">
        Start My Journey
      </button>
      <button class="btn btn-secondary" onclick="window.location.href='parent-guide.html'">
        Parent Resources
      </button>
    </div>
  </main>

  <footer>© 2026 ReadyOnline · Empowering digital awareness for teens and families</footer>
</body>
</html>
