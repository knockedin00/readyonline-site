<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ReadyOnline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-start: #141a2a;
      --bg-end: #1f2a40;
      --card-bg: #25324a;
      --card-bg-light: #2e3c57;
      --accent: #38bdf8;
      --accent-strong: #3b82f6;
      --highlight: #facc15;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #3b82f6;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
      color: var(--text);
    }

    header {
      padding: 24px 20px;
      background: rgba(30, 41, 59, 0.6);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(6px);
    }

    .nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .nav a:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    .hero {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 40px;
      color: var(--highlight);
      margin-bottom: 12px;
    }
